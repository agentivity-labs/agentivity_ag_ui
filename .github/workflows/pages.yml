name: Deploy demos to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter web demos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Add web support to each example ──────────────────────────────────────

      - name: Enable web — example
        working-directory: example
        run: flutter create --platforms web . --project-name example

      - name: Enable web — example_shopping
        working-directory: example_shopping
        run: flutter create --platforms web . --project-name example_shopping

      - name: Enable web — example_agentivity
        working-directory: example_agentivity
        run: flutter create --platforms web . --project-name example_agentivity

      # ── Build ─────────────────────────────────────────────────────────────────

      - name: Build example
        working-directory: example
        run: |
          flutter pub get
          flutter build web --release \
            --base-href /agentivity_ag_ui/example/

      - name: Build example_shopping
        working-directory: example_shopping
        run: |
          flutter pub get
          flutter build web --release \
            --base-href /agentivity_ag_ui/example_shopping/

      - name: Build example_agentivity
        working-directory: example_agentivity
        run: |
          flutter pub get
          flutter build web --release \
            --base-href /agentivity_ag_ui/example_agentivity/

      # ── Assemble site ─────────────────────────────────────────────────────────

      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/index.html              _site/index.html
          # CNAME is handled by the agentivity-labs.github.io org hub repo
          cp -r example/build/web          _site/example
          cp -r example_shopping/build/web _site/example_shopping
          cp -r example_agentivity/build/web _site/example_agentivity

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
