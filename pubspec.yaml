name: agentivity_ag_ui
description: >-
  Flutter package for AI agent UIs — AG-UI protocol, SSE streaming, chat panel,
  HIL forms, AI assistant, and agent run monitor. Bring your own backend.
version: 0.3.1
repository: https://github.com/agentivity-labs/agentivity_ag_ui
homepage: https://labs.agentivity.io/agentivity_ag_ui/
issue_tracker: https://github.com/agentivity-labs/agentivity_ag_ui/issues

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.5.0
  flutter_markdown_plus: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  fake_async: ^1.3.1
